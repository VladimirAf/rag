[tool.poetry]
name = "llm-products"
version = "0.1.0"
description = ""
authors = ["Ilia Novikov <ilianovi33@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = ">=0.115.14,<0.116.0"}
langchain = ">=0.3.26,<0.4.0"
pydantic-settings = ">=2.10.1,<3.0.0"
chromadb = ">=1.0.15,<2.0.0"
langchain-community = ">=0.3.27,<0.4.0"
openai = ">=1.93.0,<2.0.0"
tiktoken = ">=0.9.0,<0.10.0"
langchain-chroma = ">=0.2.4,<0.3.0"
langchain-openai = ">=0.3.27,<0.4.0"
unstructured = {extras = ["all-docs"], version = ">=0.18.3,<0.19.0"}
langchain-unstructured = ">=0.1.6,<0.2.0"
filetype = ">=1.2.0,<2.0.0"
humanfriendly = ">=10.0,<11.0"
langchain-huggingface = ">=0.3.0,<0.4.0"
markdown = ">=3.8.2,<4.0.0"
langchain-anthropic = ">=0.3.17,<0.4.0"
sentence-transformers = ">=5.0.0,<6.0.0"
pdf2image = ">=1.17.0,<2.0.0"
langchain-xai = ">=0.2.5,<0.3.0"
requests = ">=2.31.0,<3.0.0"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"
pytest = "^8.0.0"
pytest-asyncio = "^0.21.0"
pytest-mock = "^3.12.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


